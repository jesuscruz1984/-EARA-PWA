<body>
<div class="drawerShade" id="drawerShade"></div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="sideTop"><button class="newChat" id="newChat">＋ New chat</button></div>
  <div class="brand"><span class="orb"></span> Agent 1.0</div>
  <div class="threads" id="threads"></div>
  <div class="sideFoot">Smart hybrid AI<br>Terra for everyday work • Sol for harder reasoning<br>Automatic web search when current information matters.</div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="topLeft"><button class="menu" id="menuBtn">☰</button><div class="title">Agent 1.0</div><div class="modelPill">Smart • Terra + Sol</div></div>
    <div class="topActions"><button class="iconBtn" id="voiceToggle" title="Speak replies">🔊 <span class="label">Voice</span></button><button class="iconBtn" id="clearBtn" title="Clear current chat">⌫</button></div>
  </header>
  <section class="chat" id="chat"><div class="messages" id="messages"></div></section>
  <div class="attachments" id="attachments">
    <button class="attachAction" id="uploadBtn">🖼️<small>Photo</small></button>
    <button class="attachAction" id="cameraBtn">📷<small>Camera</small></button>
    <button class="attachAction" id="webHintBtn">🌐<small>Search web</small></button>
  </div>
  <div class="composerWrap">
    <div class="composer">
      <div class="preview" id="preview"><img id="previewImg" alt="selected image"><button id="removeImage">×</button></div>
      <div class="inputRow">
        <button class="addBtn" id="addBtn" title="Add">＋</button>
        <textarea class="prompt" id="prompt" rows="1" placeholder="Message Agent 1.0"></textarea>
        <button class="micBtn" id="dictateBtn" title="Dictate">🎙</button>
        <button class="sendBtn" id="sendBtn" title="Send">↑</button>
      </div>
      <div class="composerBottom"><span id="status" class="statusText ok">Ready</span><span>Agent 1.0 can make mistakes. Check important info.</span></div>
    </div>
  </div>
</main>
</div>
<input id="fileInput" class="hidden" type="file" accept="image/*">
<div class="cameraModal" id="cameraModal"><div class="cameraCard"><video class="cameraVideo" id="cameraVideo" autoplay muted playsinline></video><div class="cameraBar"><button id="closeCamera">Close</button><button class="use" id="useCamera">Use current view</button></div></div></div>
<canvas id="cameraCanvas" class="hidden"></canvas>
<script src="app.js?v=1"></script>
</body>
