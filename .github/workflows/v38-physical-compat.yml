name: Agent v38 Physical Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "agent-1.0/**"
      - "agent-wrapper-v4.js"
      - ".github/workflows/v38-physical-compat.yml"

permissions:
  contents: read

concurrency:
  group: agent-v38-physical
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic
      - name: Build v38
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify v38 APK
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='com.eara.ai'" apk-badging.txt
          grep -q "versionCode='38'" apk-badging.txt
          grep -q "launchable-activity: name='com.eara.ai.MainActivity'" apk-badging.txt
          echo V38_BUILD_METADATA=PASS
      - uses: actions/upload-artifact@v7
        with:
          name: agent-v38-build
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            apk-badging.txt
          retention-days: 7

  runtime:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            image: system-images;android-26;default;x86_64
            device: pixel_2
            label: android8
          - api: 35
            image: system-images;android-35;default;x86_64
            device: pixel_6
            label: android15
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: android-actions/setup-android@v3
      - name: Install emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "${{ matrix.image }}"
      - uses: actions/download-artifact@v7
        with:
          name: agent-v38-build
          path: downloaded
      - name: Boot ${{ matrix.label }} and cold-launch v38
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/downloaded/android-app/app/build/outputs/apk/debug/app-debug.apk"
          AVD="agent_v38_${{ matrix.api }}"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.android/avd-${{ matrix.api }}"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd --force --name "$AVD" --package "${{ matrix.image }}" --device "${{ matrix.device }}"
          emulator -list-avds | tee "avds-${{ matrix.label }}.txt"
          grep -qx "$AVD" "avds-${{ matrix.label }}.txt"

          ACCEL=off
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            if emulator -accel-check 2>&1 | grep -qi "usable"; then ACCEL=on; fi
          fi
          emulator -avd "$AVD" -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel "$ACCEL" > "emulator-${{ matrix.label }}.log" 2>&1 &
          EPID=$!
          trap 'adb emu kill >/dev/null 2>&1 || true; kill $EPID >/dev/null 2>&1 || true' EXIT
          adb start-server
          OK=0
          for i in $(seq 1 220); do
            if ! kill -0 "$EPID" 2>/dev/null; then tail -200 "emulator-${{ matrix.label }}.log"; exit 1; fi
            if [ "$(adb get-state 2>/dev/null || true)" = device ] && [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = 1 ]; then OK=1; break; fi
            sleep 3
          done
          test "$OK" -eq 1
          sleep 15

          adb install -r -g "$APK" | tee "install-${{ matrix.label }}.txt"
          grep -q Success "install-${{ matrix.label }}.txt"
          adb logcat -c || true
          adb shell am force-stop com.eara.ai || true
          OUT="$(adb shell am start -W -n com.eara.ai/.MainActivity 2>&1)"
          echo "$OUT" | tee "launch-${{ matrix.label }}.txt"
          echo "$OUT" | grep -q "Status: ok"
          sleep 30

          PID="$(adb shell pidof com.eara.ai | tr -d '\r' || true)"
          test -n "$PID"
          adb shell dumpsys activity activities > "activity-${{ matrix.label }}.txt"
          grep -qE "topResumedActivity=.*com\.eara\.ai/.MainActivity|ResumedActivity:.*com\.eara\.ai/.MainActivity" "activity-${{ matrix.label }}.txt"
          adb logcat -d -v time > "logcat-${{ matrix.label }}.txt" || true
          if grep -q "Process: com.eara.ai" "logcat-${{ matrix.label }}.txt"; then
            grep -n -B10 -A50 "Process: com.eara.ai" "logcat-${{ matrix.label }}.txt" || true
            exit 1
          fi
          adb exec-out screencap -p > "screen-${{ matrix.label }}.png"
          test -s "screen-${{ matrix.label }}.png"
          echo "V38_${{ matrix.label }}_COLD_LAUNCH=PASS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: v38-${{ matrix.label }}-evidence
          path: |
            emulator-${{ matrix.label }}.log
            install-${{ matrix.label }}.txt
            launch-${{ matrix.label }}.txt
            activity-${{ matrix.label }}.txt
            logcat-${{ matrix.label }}.txt
            screen-${{ matrix.label }}.png
            avds-${{ matrix.label }}.txt
          if-no-files-found: warn
          retention-days: 7

  publish:
    needs: [build, runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: agent-v38-build
          path: downloaded
      - name: Package only after both Android versions pass
        run: |
          set -euo pipefail
          cp downloaded/android-app/app/build/outputs/apk/debug/app-debug.apk Agent-1.0-ORDRO-EP6-v38.apk
          sha256sum Agent-1.0-ORDRO-EP6-v38.apk > Agent-1.0-ORDRO-EP6-v38.apk.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Agent-1.0-ORDRO-EP6-v38-PHYSICAL-SAFE
          path: |
            Agent-1.0-ORDRO-EP6-v38.apk
            Agent-1.0-ORDRO-EP6-v38.apk.sha256
          retention-days: 30
