name: Deploy EARA Worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "secure-worker.js"
      - "agent-wrapper.js"
      - "agent-wrapper-v2.js"
      - "agent-wrapper-v3.js"
      - "agent-wrapper-v4.js"
      - "agent-wrapper-v5.js"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eara-worker-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Deploy Cloudflare Worker
        run: npx --yes wrangler@latest deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
