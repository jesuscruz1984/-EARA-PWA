name: Build EARA Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "app.js"
      - "handsfree.js"
      - "index.html"
      - "sw.js"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: eara-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic

      - name: Install Android SDK 36
        run: "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare named APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk EARA-v26-android.apk
          sha256sum EARA-v26-android.apk > EARA-v26-android.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: EARA-v26-android-apk
          path: |
            EARA-v26-android.apk
            EARA-v26-android.apk.sha256
          if-no-files-found: error
          retention-days: 30
