name: Build Agent 1.0 ORDRO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "agent-1.0/**"
      - "app.js"
      - "handsfree.js"
      - "index.html"
      - "sw.js"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: eara-android-apk
  cancel-in-progress: true

jobs:
  build-and-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic

      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and launcher
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "package: name='com.eara.ai'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "versionCode='33'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "launchable-activity: name='com.eara.ai.MainActivity'" "$GITHUB_WORKSPACE/apk-badging.txt"

      - name: Prepare launch smoke test
        run: |
          cat > /tmp/agent-launch-test.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug/app-debug.apk"
          SCREENSHOT="$GITHUB_WORKSPACE/agent-launch.png"
          UI_XML="$GITHUB_WORKSPACE/agent-launch-ui.xml"
          CRASH_LOG="$GITHUB_WORKSPACE/agent-launch-logcat.txt"
          ACTIVITY_LOG="$GITHUB_WORKSPACE/agent-launch-activity.txt"

          echo "=== Install APK ==="
          test -s "$APK"
          adb install -r "$APK"

          # Avoid Android permission dialogs masking the launch result.
          adb shell pm grant com.eara.ai android.permission.CAMERA || true
          adb shell pm grant com.eara.ai android.permission.RECORD_AUDIO || true
          adb shell pm grant com.eara.ai android.permission.NEARBY_WIFI_DEVICES || true

          adb logcat -c
          adb shell am force-stop com.eara.ai || true

          echo "=== Launch Agent 1.0 ==="
          LAUNCH_OUTPUT="$(adb shell am start -W -n com.eara.ai/.MainActivity)"
          echo "$LAUNCH_OUTPUT"
          echo "$LAUNCH_OUTPUT" | grep -q "Status: ok"

          sleep 20

          echo "=== Process check ==="
          PID="$(adb shell pidof com.eara.ai | tr -d '\r' || true)"
          echo "PID=$PID"
          test -n "$PID"

          echo "=== Foreground activity check ==="
          adb shell dumpsys activity activities > "$ACTIVITY_LOG"
          grep -E "topResumedActivity|mResumedActivity|ResumedActivity|com\.eara\.ai" "$ACTIVITY_LOG" | head -100 || true
          if ! grep -qE "topResumedActivity=.*com\.eara\.ai/.MainActivity|mResumedActivity:.*com\.eara\.ai/.MainActivity|ResumedActivity:.*com\.eara\.ai/.MainActivity" "$ACTIVITY_LOG"; then
            echo "Agent 1.0 is not the resumed foreground activity."
            exit 1
          fi

          echo "=== Visible-window evidence ==="
          adb shell uiautomator dump /sdcard/agent-window.xml >/dev/null 2>&1 || true
          adb pull /sdcard/agent-window.xml "$UI_XML" >/dev/null 2>&1 || true
          adb exec-out screencap -p > "$SCREENSHOT"
          test -s "$SCREENSHOT"

          echo "=== Crash scan ==="
          adb logcat -d -v time > "$CRASH_LOG" || true
          if adb logcat -d -v brief AndroidRuntime:E '*:S' | grep -qE "FATAL EXCEPTION|Process: com\.eara\.ai"; then
            echo "Agent 1.0 hit a fatal Java exception during startup."
            adb logcat -d -v brief AndroidRuntime:E '*:S' || true
            exit 1
          fi

          echo "AGENT_REAL_LAUNCH_TEST=PASS"
          EOF
          chmod +x /tmp/agent-launch-test.sh

      - name: Install and launch on same Android simulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash /tmp/agent-launch-test.sh

      - name: Prepare verified v33 APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Agent-1.0-ORDRO-EP6-v33.apk
          sha256sum Agent-1.0-ORDRO-EP6-v33.apk > Agent-1.0-ORDRO-EP6-v33.apk.sha256

      - name: Upload verified v33 APK
        uses: actions/upload-artifact@v7
        with:
          name: Agent-1.0-ORDRO-EP6-v33-verified
          path: |
            Agent-1.0-ORDRO-EP6-v33.apk
            Agent-1.0-ORDRO-EP6-v33.apk.sha256
            agent-launch.png
            agent-launch-ui.xml
            agent-launch-logcat.txt
            agent-launch-activity.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Agent-1.0-v33-failure-diagnostics
          path: |
            agent-launch.png
            agent-launch-ui.xml
            agent-launch-logcat.txt
            agent-launch-activity.txt
            apk-badging.txt
          if-no-files-found: warn
          retention-days: 7
