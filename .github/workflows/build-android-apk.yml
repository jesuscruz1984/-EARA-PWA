name: Build Agent 1.0 ORDRO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "agent-1.0/**"
      - "app.js"
      - "handsfree.js"
      - "index.html"
      - "sw.js"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: eara-android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic

      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare launch smoke test
        run: |
          cat > /tmp/agent-launch-test.sh <<'EOF'
          #!/usr/bin/env bash
          set -eu
          APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug/app-debug.apk"
          echo "Installing $APK"
          test -s "$APK"
          adb install -r "$APK"
          adb logcat -c
          adb shell am force-stop com.eara.ai || true
          adb shell monkey -p com.eara.ai -c android.intent.category.LAUNCHER 1
          sleep 12
          echo "=== Agent process ==="
          PID="$(adb shell pidof com.eara.ai | tr -d '\r' || true)"
          echo "PID=$PID"
          echo "=== Foreground activity ==="
          adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity|com\.eara\.ai" | head -40 || true
          echo "=== Crash scan ==="
          adb logcat -d -v brief AndroidRuntime:E ActivityTaskManager:E chromium:E '*:S' > /tmp/agent-crash.log || true
          cat /tmp/agent-crash.log || true
          if [ -z "$PID" ]; then
            echo "Agent 1.0 process is not alive after launch."
            exit 1
          fi
          if grep -E "FATAL EXCEPTION|Process: com\.eara\.ai" /tmp/agent-crash.log; then
            echo "Agent 1.0 crashed during startup."
            exit 1
          fi
          echo "AGENT_LAUNCH_SMOKE_TEST=PASS"
          EOF
          chmod +x /tmp/agent-launch-test.sh

      - name: Install and launch APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash /tmp/agent-launch-test.sh

      - name: Prepare named APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Agent-1.0-ORDRO-EP6-v28.apk
          sha256sum Agent-1.0-ORDRO-EP6-v28.apk > Agent-1.0-ORDRO-EP6-v28.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Agent-1.0-ORDRO-EP6-v28-apk
          path: |
            Agent-1.0-ORDRO-EP6-v28.apk
            Agent-1.0-ORDRO-EP6-v28.apk.sha256
          if-no-files-found: error
          retention-days: 30
