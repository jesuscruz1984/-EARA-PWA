name: Build Agent 1.0 ORDRO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "agent-1.0/**"
      - "agent-wrapper-v4.js"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: eara-android-apk
  cancel-in-progress: true

jobs:
  build-and-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Unit test browser PDF and Word generators
        run: |
          set -euo pipefail
          node --input-type=commonjs <<'NODE'
          const fs=require('fs'),vm=require('vm');
          vm.runInThisContext(fs.readFileSync('agent-1.0/upgrade-v36.js','utf8'),{filename:'upgrade-v36.js'});
          if(!globalThis.AgentArtifacts||AgentArtifacts.version!=='36')throw new Error('v36 artifact API missing');
          const files=AgentArtifacts.buildFiles({title:'Agent V36 Test',content:'# Test document\n\nThis verifies a real PDF and a real Word document.\n\n- Camera\n- Attachments\n- Documents',formats:['pdf','docx']},'Create a PDF and Word document');
          if(files.length!==2)throw new Error('Expected PDF and DOCX');
          for(const f of files)fs.writeFileSync('/tmp/'+f.name,Buffer.from(f.data,'base64'));
          const pdf=files.find(f=>f.name.endsWith('.pdf')),docx=files.find(f=>f.name.endsWith('.docx'));
          if(!Buffer.from(pdf.data,'base64').subarray(0,5).equals(Buffer.from('%PDF-')))throw new Error('Invalid PDF signature');
          if(!Buffer.from(docx.data,'base64').subarray(0,2).equals(Buffer.from('PK')))throw new Error('Invalid DOCX ZIP signature');
          console.log('BROWSER_PDF_GENERATOR=PASS');
          console.log('BROWSER_DOCX_GENERATOR=PASS');
          NODE
          unzip -t /tmp/Agent-V36-Test.docx
          unzip -p /tmp/Agent-V36-Test.docx word/document.xml | grep -q 'This verifies a real PDF and a real Word document.'
          echo 'DOCX_OPENXML_STRUCTURE=PASS'

      - name: Wait for v36 frontend and document backend deployment
        run: |
          set -euo pipefail
          FRONT=0
          for i in $(seq 1 36); do
            if curl -fsS --max-time 15 "https://jesuscruz1984.github.io/-EARA-PWA/agent-1.0/upgrade-v36.js?v=36" | grep -q "const VERSION='36'"; then FRONT=1; break; fi
            sleep 5
          done
          test "$FRONT" -eq 1
          echo 'V36_FRONTEND_LIVE=PASS'

          DOC=0
          for i in $(seq 1 36); do
            if curl -fsS --max-time 40 \
              -H 'Origin: https://jesuscruz1984.github.io' \
              -H 'Content-Type: application/json' \
              --data '{"text":"Create a Word document titled Deployment Check with two short paragraphs.","memory":"","memoryCount":0,"forceWeb":false,"agentMode":true,"localDate":"August 27, 2026"}' \
              https://eara-pwa.jesuscruz1984.workers.dev/agent-chat > /tmp/document-draft.json; then
              if jq -e '.route == "document-draft-v36" and (.documentDraft.formats | index("docx")) != null and ((.documentDraft.content // "") | length) > 20' /tmp/document-draft.json >/dev/null; then DOC=1; break; fi
            fi
            sleep 5
          done
          cat /tmp/document-draft.json || true
          test "$DOC" -eq 1
          echo 'V36_WORD_BACKEND_LIVE=PASS'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install original EARA build SDK and same Pixel 6 simulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;default;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic

      - name: Build APK using original EARA build flow
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK package and launcher
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "package: name='com.eara.ai'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "versionCode='36'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "launchable-activity: name='com.eara.ai.MainActivity'" "$GITHUB_WORKSPACE/apk-badging.txt"
          echo 'APK_METADATA=PASS'

      - name: Same Android 15 Pixel 6 full interaction test
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug/app-debug.apk"
          EMULATOR_LOG="$GITHUB_WORKSPACE/emulator.log"
          SCREENSHOT="$GITHUB_WORKSPACE/agent-v36-final.png"
          PHONE_SCREENSHOT="$GITHUB_WORKSPACE/agent-v36-phone-camera.png"
          CRASH_LOG="$GITHUB_WORKSPACE/agent-v36-logcat.txt"
          ACTIVITY_LOG="$GITHUB_WORKSPACE/agent-v36-activity.txt"
          WINDOW_LOG="$GITHUB_WORKSPACE/agent-v36-window.txt"
          PACKAGE_LOG="$GITHUB_WORKSPACE/agent-v36-package.txt"
          CDP_LOG="$GITHUB_WORKSPACE/agent-v36-cdp.txt"
          AVD_NAME="eara_pixel6_api35"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"

          echo no | avdmanager create avd --force \
            --name "$AVD_NAME" \
            --package "system-images;android-35;default;x86_64" \
            --device "pixel_6"
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee "$GITHUB_WORKSPACE/emulator-avds.txt"
          grep -qx "$AVD_NAME" "$GITHUB_WORKSPACE/emulator-avds.txt"

          ACCEL="off"
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
            if "$ANDROID_HOME/emulator/emulator" -accel-check 2>&1 | tee "$GITHUB_WORKSPACE/emulator-accel.txt" | grep -qi "is installed and usable"; then ACCEL="on"; fi
          fi
          echo "Emulator acceleration: $ACCEL"

          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim \
            -camera-back virtualscene -camera-front emulated -accel "$ACCEL" >"$EMULATOR_LOG" 2>&1 &
          EMU_PID=$!
          cleanup(){ adb emu kill >/dev/null 2>&1 || true; kill "$EMU_PID" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          adb start-server
          BOOT_OK=0
          for i in $(seq 1 240); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then tail -200 "$EMULATOR_LOG"; exit 1; fi
            STATE="$(adb get-state 2>/dev/null || true)"
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then BOOT_OK=1; break; fi
            sleep 3
          done
          test "$BOOT_OK" -eq 1
          echo 'ANDROID_15_PIXEL6_BOOT=PASS'
          sleep 20

          adb install -r -g "$APK" | tee "$GITHUB_WORKSPACE/adb-install.txt"
          grep -q 'Success' "$GITHUB_WORKSPACE/adb-install.txt"
          adb shell dumpsys package com.eara.ai > "$PACKAGE_LOG"
          grep -q 'versionCode=36' "$PACKAGE_LOG"
          echo 'APK_INSTALL_V36=PASS'

          adb logcat -c || true
          adb shell am force-stop com.eara.ai || true
          LAUNCH_OUTPUT="$(adb shell am start -W -n com.eara.ai/.MainActivity)"
          echo "$LAUNCH_OUTPUT"
          echo "$LAUNCH_OUTPUT" | grep -q 'Status: ok'
          echo 'MAIN_ACTIVITY_START=PASS'
          sleep 25

          PID="$(adb shell pidof com.eara.ai | tr -d '\r')"
          test -n "$PID"
          adb shell dumpsys activity activities > "$ACTIVITY_LOG"
          grep -qE "topResumedActivity=.*com\.eara\.ai/.MainActivity|ResumedActivity:.*com\.eara\.ai/.MainActivity" "$ACTIVITY_LOG"
          echo 'PROCESS_AND_FOREGROUND=PASS'

          python3 -m pip install --quiet websocket-client
          SOCKET="$(adb shell cat /proc/net/unix | tr -d '\r' | awk '/webview_devtools_remote/{print $8}' | tail -1 | sed 's/^@//')"
          echo "WebView debug socket: $SOCKET"
          test -n "$SOCKET"
          adb forward tcp:9222 "localabstract:$SOCKET"

          cat > /tmp/cdp_test.py <<'PY'
          import base64,json,subprocess,time,urllib.request,websocket,sys
          def sh(*args,check=True):
              p=subprocess.run(args,text=True,capture_output=True)
              if check and p.returncode: raise RuntimeError(p.stdout+p.stderr)
              return p.stdout+p.stderr
          pages=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=10))
          page=next((p for p in pages if 'agent-1.0' in p.get('url','')),pages[0])
          ws=websocket.create_connection(page['webSocketDebuggerUrl'],timeout=20,suppress_origin=True)
          n=0
          def ev(expr,await_promise=False):
              global n;n+=1
              ws.send(json.dumps({'id':n,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True,'awaitPromise':await_promise}}))
              while True:
                  r=json.loads(ws.recv())
                  if r.get('id')!=n: continue
                  if 'exceptionDetails' in r.get('result',{}): raise RuntimeError(json.dumps(r['result']['exceptionDetails']))
                  ro=r['result']['result']
                  return ro.get('value')
          def wait(expr,seconds=30):
              end=time.time()+seconds
              while time.time()<end:
                  try:
                      v=ev(expr)
                      if v:return v
                  except Exception: pass
                  time.sleep(1)
              raise RuntimeError('Timed out: '+expr)
          wait("document.readyState==='complete' && window.AgentArtifacts && AgentArtifacts.version==='36'",45)
          assert ev("typeof EARANative==='object' && typeof EARANative.saveBase64File==='function'") is True
          print('V36_FRONTEND_IN_WEBVIEW=PASS')
          print('NATIVE_SAVE_BRIDGE=PASS')

          plus=ev("(()=>{const a=document.querySelector('#attachments');a.classList.remove('show');const p=document.querySelector('#addBtn path');p.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));return a.classList.contains('show')})()")
          assert plus is True
          print('PLUS_SVG_TAP_MENU=PASS')

          labels=ev("(()=>({upload:document.querySelector('#uploadBtn small')?.textContent,phone:document.querySelector('#phoneCameraBtn small')?.textContent,ep6:document.querySelector('#cameraBtn small')?.textContent}))()")
          assert labels.get('upload')=='Upload file' and labels.get('phone')=='Phone camera' and labels.get('ep6')=='EP6 camera',labels
          print('UPLOAD_PHONE_EP6_BUTTONS=PASS')

          rect=ev("(()=>{const r=document.querySelector('#uploadBtn').getBoundingClientRect(),d=devicePixelRatio;return {x:Math.round((r.left+r.width/2)*d),y:Math.round((r.top+r.height/2)*d)}})()")
          sh('adb','shell','input','tap',str(rect['x']),str(rect['y']))
          time.sleep(2)
          act=sh('adb','shell','dumpsys','activity','activities')
          top=next((x for x in act.splitlines() if 'topResumedActivity=' in x),'')
          if 'com.eara.ai/.MainActivity' in top: raise RuntimeError('Android file picker did not open: '+top)
          if not any(x in top.lower() for x in ['documentsui','picker','resolver','intentresolver']): raise RuntimeError('Unexpected picker activity: '+top)
          print('ANDROID_FILE_PICKER_OPEN=PASS')
          sh('adb','shell','input','keyevent','4');time.sleep(2)
          wait("document.visibilityState==='visible'",10)

          ev("document.querySelector('#phoneCameraBtn').click();true")
          wait("document.querySelector('#cameraModal').classList.contains('show') && document.querySelector('#cameraVideo').videoWidth>0",25)
          subprocess.run('adb exec-out screencap -p > "$GITHUB_WORKSPACE/agent-v36-phone-camera.png"',shell=True,check=True,executable='/bin/bash')
          cap=ev("(()=>{captureCamera();return selectedImage.startsWith('data:image/jpeg')})()")
          assert cap is True
          print('PHONE_CAMERA_PREVIEW_AND_CAPTURE=PASS')

          stat=json.loads(ev("EARANative.getWearableCameraStatus()"))
          assert 'supported' in stat
          click=ev("(()=>{document.querySelector('#attachments').classList.add('show');document.querySelector('#cameraBtn').click();return true})()")
          time.sleep(1)
          stat2=json.loads(ev("EARANative.getWearableCameraStatus()"))
          assert stat2.get('state') not in ['error','unsupported'],stat2
          print('EP6_BUTTON_BRIDGE_CALL=PASS state='+str(stat2.get('state')))
          sh('adb','shell','input','keyevent','4',check=False);time.sleep(1)

          prompt='Create a PDF and Word document titled Emulator Document Test. Include the sentence: File generation works on Agent 1.0.'
          result=ev("(async()=>{window.__v36doc=await fetchChat("+json.dumps(prompt)+",'',null);return {route:__v36doc.route,names:(__v36doc.files||[]).map(f=>f.name),mimes:(__v36doc.files||[]).map(f=>f.mime),sigs:(__v36doc.files||[]).map(f=>atob(f.data).slice(0,5))}})()",True)
          assert result['route']=='document-draft-v36',result
          assert any(n.lower().endswith('.pdf') for n in result['names']),result
          assert any(n.lower().endswith('.docx') for n in result['names']),result
          assert any(s.startswith('%PDF-') for s in result['sigs']),result
          assert any(s.startswith('PK') for s in result['sigs']),result
          print('LIVE_PDF_AND_WORD_GENERATION=PASS')

          ev("(()=>{addMessage({role:'assistant',text:'v36 generated files',files:__v36doc.files,toolsUsed:['pdf','word']});return true})()")
          wait("document.querySelectorAll('a[download]').length>=2",10)
          labels2=ev("Array.from(document.querySelectorAll('a[download]')).map(a=>a.textContent)")
          assert 'Save PDF' in labels2 and 'Save Word' in labels2,labels2
          print('PDF_WORD_SAVE_BUTTONS=PASS')

          ev("document.querySelector('a[download$=\".pdf\"]').click();true")
          time.sleep(3)
          ls=sh('adb','shell','ls','/sdcard/Download/Agent1',check=False)
          assert '.pdf' in ls.lower(),ls
          print('NATIVE_PDF_SAVE_TO_DOWNLOADS=PASS')
          sh('adb','shell','input','keyevent','4',check=False);time.sleep(1)
          ev("document.querySelector('a[download$=\".docx\"]').click();true")
          time.sleep(3)
          ls=sh('adb','shell','ls','/sdcard/Download/Agent1',check=False)
          assert '.docx' in ls.lower(),ls
          print('NATIVE_WORD_SAVE_TO_DOWNLOADS=PASS')
          open('/tmp/cdp-pass.txt','w').write('ALL_INTERACTION_TESTS=PASS\n')
          PY

          GITHUB_WORKSPACE="$GITHUB_WORKSPACE" python3 /tmp/cdp_test.py | tee "$CDP_LOG"
          grep -q 'ALL_INTERACTION_TESTS=PASS' /tmp/cdp-pass.txt

          adb shell am start -n com.eara.ai/.MainActivity >/dev/null 2>&1 || true
          sleep 2
          adb exec-out screencap -p > "$SCREENSHOT"
          adb shell dumpsys window windows > "$WINDOW_LOG" || true
          adb logcat -d -v time > "$CRASH_LOG" || true
          if grep -q 'Process: com.eara.ai' "$CRASH_LOG"; then
            grep -n -B10 -A50 'Process: com.eara.ai' "$CRASH_LOG"; exit 1
          fi
          echo 'NO_AGENT_FATAL_CRASH=PASS'
          echo 'AGENT_V36_FULL_INTERACTION_TEST=PASS'

      - name: Prepare verified v36 APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Agent-1.0-ORDRO-EP6-v36.apk
          sha256sum Agent-1.0-ORDRO-EP6-v36.apk > Agent-1.0-ORDRO-EP6-v36.apk.sha256

      - name: Upload verified v36 APK and evidence
        uses: actions/upload-artifact@v7
        with:
          name: Agent-1.0-ORDRO-EP6-v36-fully-tested
          path: |
            Agent-1.0-ORDRO-EP6-v36.apk
            Agent-1.0-ORDRO-EP6-v36.apk.sha256
            agent-v36-final.png
            agent-v36-phone-camera.png
            agent-v36-logcat.txt
            agent-v36-activity.txt
            agent-v36-window.txt
            agent-v36-package.txt
            agent-v36-cdp.txt
            apk-badging.txt
            adb-install.txt
            emulator.log
            emulator-accel.txt
            emulator-avds.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload v36 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Agent-1.0-v36-failure-diagnostics
          path: |
            agent-v36-final.png
            agent-v36-phone-camera.png
            agent-v36-logcat.txt
            agent-v36-activity.txt
            agent-v36-window.txt
            agent-v36-package.txt
            agent-v36-cdp.txt
            apk-badging.txt
            adb-install.txt
            emulator.log
            emulator-accel.txt
            emulator-avds.txt
          if-no-files-found: warn
          retention-days: 7
