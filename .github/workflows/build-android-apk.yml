name: Build Agent 1.0 ORDRO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "agent-1.0/**"
      - "app.js"
      - "handsfree.js"
      - "index.html"
      - "sw.js"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: eara-android-apk
  cancel-in-progress: true

jobs:
  build-and-runtime-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Linux KVM acceleration
        run: |
          set -eux
          uname -a
          test "$(uname -m)" = "x86_64"
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm

      - name: Install Android build and emulator SDKs
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "emulator" \
            "platforms;android-35" \
            "system-images;android-35;google_apis;x86_64"
          sdkmanager --list | grep -F "system-images;android-35;google_apis;x86_64"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.1.0"
          cache-provider: basic

      - name: Build and lint APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug

      - name: Verify APK package and launcher
        run: |
          set -euo pipefail
          APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "package: name='com.eara.ai'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "versionCode='32'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "launchable-activity: name='com.eara.ai.MainActivity'" "$GITHUB_WORKSPACE/apk-badging.txt"

      - name: Verify Agent web app is reachable
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 -fSL \
            "https://jesuscruz1984.github.io/-EARA-PWA/agent-1.0/" \
            -o /tmp/agent-1.0.html
          grep -q "<title>Agent 1.0</title>" /tmp/agent-1.0.html

      - name: Boot Android 15 emulator and launch Agent
        run: |
          set -euo pipefail

          APK="$GITHUB_WORKSPACE/android-app/app/build/outputs/apk/debug/app-debug.apk"
          EMULATOR_LOG="$GITHUB_WORKSPACE/emulator.log"
          UI_XML="$GITHUB_WORKSPACE/agent-launch-ui.xml"
          SCREENSHOT="$GITHUB_WORKSPACE/agent-launch.png"
          CRASH_LOG="$GITHUB_WORKSPACE/agent-launch-logcat.txt"
          GFXINFO="$GITHUB_WORKSPACE/agent-launch-gfxinfo.txt"
          AVD_NAME="agent_api35"

          echo no | avdmanager create avd --force \
            --name "$AVD_NAME" \
            --package "system-images;android-35;google_apis;x86_64"

          "$ANDROID_HOME/emulator/emulator" \
            -avd "$AVD_NAME" \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            -accel on \
            -camera-back none \
            -camera-front none \
            >"$EMULATOR_LOG" 2>&1 &
          EMU_PID=$!

          cleanup() {
            adb emu kill >/dev/null 2>&1 || true
            kill "$EMU_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          adb start-server
          BOOT_OK=0
          for i in $(seq 1 120); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "Android emulator exited before boot completed."
              cat "$EMULATOR_LOG"
              exit 1
            fi
            STATE="$(adb get-state 2>/dev/null || true)"
            BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$STATE" = "device" ] && [ "$BOOT" = "1" ]; then
              BOOT_OK=1
              break
            fi
            sleep 2
          done

          if [ "$BOOT_OK" -ne 1 ]; then
            echo "Android emulator did not finish booting."
            cat "$EMULATOR_LOG"
            exit 1
          fi
          echo "ANDROID_EMULATOR_BOOT=PASS"

          adb shell input keyevent 82 || true
          adb install -r "$APK"

          # Pre-grant permissions so the smoke test measures Agent startup rather
          # than stopping on Android's system permission dialogs.
          adb shell pm grant com.eara.ai android.permission.CAMERA || true
          adb shell pm grant com.eara.ai android.permission.RECORD_AUDIO || true
          adb shell pm grant com.eara.ai android.permission.NEARBY_WIFI_DEVICES || true

          adb logcat -c
          adb shell am force-stop com.eara.ai || true

          echo "Launching MainActivity directly"
          LAUNCH_OUTPUT="$(adb shell am start -W -n com.eara.ai/.MainActivity)"
          echo "$LAUNCH_OUTPUT"
          echo "$LAUNCH_OUTPUT" | grep -q "Status: ok"

          sleep 20

          PID="$(adb shell pidof com.eara.ai | tr -d '\r' || true)"
          echo "Agent PID=$PID"
          test -n "$PID"

          ACTIVITY_DUMP="$(adb shell dumpsys activity activities)"
          echo "$ACTIVITY_DUMP" | grep -E "topResumedActivity|mResumedActivity|startingWindow|com\.eara\.ai" | head -100 || true

          if echo "$ACTIVITY_DUMP" | grep -qE "startingWindow=.*Splash Screen com\.eara\.ai"; then
            echo "Agent 1.0 is still stuck on the Android splash screen."
            exit 1
          fi

          if ! echo "$ACTIVITY_DUMP" | grep -qE "topResumedActivity=.*com\.eara\.ai/.MainActivity|mResumedActivity:.*com\.eara\.ai/.MainActivity|ResumedActivity:.*com\.eara\.ai/.MainActivity"; then
            echo "Agent 1.0 MainActivity is not the resumed foreground activity."
            exit 1
          fi

          UI_OK=0
          for i in 1 2 3; do
            if adb shell uiautomator dump /sdcard/agent-window.xml >/dev/null 2>&1; then
              if adb pull /sdcard/agent-window.xml "$UI_XML" >/dev/null 2>&1; then
                UI_OK=1
                break
              fi
            fi
            sleep 2
          done
          test "$UI_OK" -eq 1
          test -s "$UI_XML"
          head -c 16000 "$UI_XML" || true
          echo

          if grep -Eq "Starting|Opening|Could not load|could not start" "$UI_XML"; then
            echo "Agent 1.0 never reached the loaded WebView UI."
            exit 1
          fi
          if ! grep -q 'package="com.eara.ai"' "$UI_XML"; then
            echo "The visible Android UI does not belong to Agent 1.0."
            exit 1
          fi

          adb exec-out screencap -p > "$SCREENSHOT"
          test -s "$SCREENSHOT"

          adb shell dumpsys gfxinfo com.eara.ai > "$GFXINFO" || true
          adb logcat -d -v time > "$CRASH_LOG" || true
          if adb logcat -d -v brief AndroidRuntime:E '*:S' | grep -qE "FATAL EXCEPTION|Process: com\.eara\.ai"; then
            echo "Agent 1.0 hit a fatal Java exception during startup."
            adb logcat -d -v brief AndroidRuntime:E '*:S' || true
            exit 1
          fi

          echo "AGENT_REAL_LAUNCH_TEST=PASS"

      - name: Prepare verified v32 APK
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk Agent-1.0-ORDRO-EP6-v32.apk
          sha256sum Agent-1.0-ORDRO-EP6-v32.apk > Agent-1.0-ORDRO-EP6-v32.apk.sha256

      - name: Upload verified v32 APK
        uses: actions/upload-artifact@v7
        with:
          name: Agent-1.0-ORDRO-EP6-v32-verified
          path: |
            Agent-1.0-ORDRO-EP6-v32.apk
            Agent-1.0-ORDRO-EP6-v32.apk.sha256
            agent-launch.png
            agent-launch-ui.xml
            agent-launch-logcat.txt
            agent-launch-gfxinfo.txt
            apk-badging.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload emulator diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: Agent-1.0-v32-failure-diagnostics
          path: |
            emulator.log
            agent-launch-ui.xml
            agent-launch.png
            agent-launch-logcat.txt
            agent-launch-gfxinfo.txt
            apk-badging.txt
          if-no-files-found: warn
          retention-days: 7
