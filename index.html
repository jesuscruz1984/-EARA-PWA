<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d"><title>EARA AI</title><style>:root{--bg:#07111d;--p:#101b2b;--p2:#14243a;--t:#f6f8fb;--m:#91a2b9;--a:#57b8ff;--g:#43d2a0}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}body{padding:env(safe-area-inset-top) 14px calc(env(safe-area-inset-bottom) + 10px)}.app{max-width:760px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 15px}h1{margin:0;font-size:24px}.sub,.small{color:var(--m);font-size:12px}.badge{border:1px solid #263852;border-radius:999px;padding:8px 11px;background:#0b1726;font-size:12px}.card{background:linear-gradient(180deg,var(--p2),var(--p));border:1px solid #20314a;border-radius:22px;overflow:hidden;margin-bottom:14px}.video{position:relative;aspect-ratio:16/10;background:#08111d}.video video{width:100%;height:100%;object-fit:cover}.chip{position:absolute;top:10px;background:#0009;border-radius:999px;padding:6px 9px;font-size:11px}.l{left:10px}.r{right:10px}.pad{padding:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}button{border:0;border-radius:14px;min-height:48px;padding:12px 14px;font-weight:700;font-size:15px;background:#1b2c43;color:white}button.primary{background:var(--a);color:#06101b}button.green{background:var(--g);color:#06130e}button:disabled{opacity:.45}.reply{background:#0a1625;border:1px solid #20344f;border-radius:16px;padding:13px;min-height:88px;line-height:1.45;overflow-wrap:anywhere}.row{display:flex;gap:9px;align-items:center}.grow{flex:1;min-width:0}input{width:100%;background:#0a1625;color:white;border:1px solid #263b57;border-radius:13px;padding:12px;font-size:16px}.mic{height:8px;background:#091422;border-radius:999px;overflow:hidden;margin-top:9px}.mic div{height:100%;width:0;background:var(--g)}.status{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin-top:9px}.hidden{display:none}nav{position:sticky;bottom:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:7px;background:#0a1625ee;border:1px solid #20334d;border-radius:18px}nav button{background:transparent;font-size:12px;min-height:42px}nav button.active{background:#18314c}@media(max-width:480px){.grid{grid-template-columns:1fr}}</style></head><body><div class="app"><header><div><h1>EARA AI</h1><div class="sub">Gemini Vision + Voice</div></div><div class="badge" id="badge">● Ready</div></header><section id="live"><div class="card"><div class="video"><video id="video" autoplay muted playsinline></video><div class="chip l" id="cam">CAMERA OFF</div><div class="chip r" id="ai">AI standby</div></div><div class="pad"><div class="grid"><button class="primary" id="start">Start Camera + Mic</button><button class="green" id="talk" disabled>Tap to Talk</button></div><div class="mic"><div id="bar"></div></div><div class="status"><span id="state">Not listening</span></div></div></div><div class="card"><div class="pad"><b>EARA Conversation</b><div class="reply" id="reply" style="margin-top:10px">Start the camera, then tap Talk.</div><div id="transcript" class="small" style="margin-top:9px"></div><div class="row" style="margin-top:10px"><input class="grow" id="typed" placeholder="Or type a question…"><button class="primary" id="ask">Ask</button></div><button id="speak" style="width:100%;margin-top:9px" disabled>Speak Reply Again</button></div></div></section><section id="memory" class="hidden"><div class="card"><div class="pad">Memory</div></div></section><section id="tasks" class="hidden"><div class="card"><div class="pad">Tasks</div></div></section><section id="settings" class="hidden"><div class="card"><div class="pad"><b>Connection</b><div class="small" style="margin:8px 0 6px">EARA backend URL (preconfigured)</div><input id="backend" placeholder="https://eara-pwa.jesuscruz1984.workers.dev"><button class="primary" id="save" style="width:100%;margin-top:9px">Save Connection</button><button class="green" id="test" style="width:100%;margin-top:9px">Test Gemini Connection</button><div class="reply" id="testResult" style="margin-top:10px;min-height:54px">Tap Test Gemini Connection to diagnose EARA.</div><div class="small" style="margin-top:10px">Your Gemini API key stays securely on the backend.</div></div></div></section><nav><button class="active" data-tab="live">Live</button><button data-tab="memory">Memory</button><button data-tab="tasks">Tasks</button><button data-tab="settings">Settings</button></nav></div><canvas id="canvas" class="hidden"></canvas><script>const $=s=>document.querySelector(s);let stream,rec,chunks=[],recording=false,lastReply='';const bk='earaBackendUrl';const DEFAULT_BACKEND='https://eara-pwa.jesuscruz1984.workers.dev';const backend=()=>($('#backend').value||localStorage.getItem(bk)||DEFAULT_BACKEND).trim().replace(/\/$/,'');function badge(x){$('#badge').textContent='● '+x}async function startMedia(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;$('#start').textContent='Start Camera + Mic';$('#talk').disabled=true;return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:true});video.srcObject=stream;await video.play();$('#start').textContent='Stop Camera + Mic';$('#talk').disabled=false;$('#cam').textContent='LIVE VISION';badge('Live')}catch(e){alert(e.message)}}function snap(){let c=$('#canvas');c.width=video.videoWidth||640;c.height=video.videoHeight||480;c.getContext('2d').drawImage(video,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.6)}function fail(e){$('#reply').textContent='Connection error: '+(e.message||e);$('#state').textContent='Error';badge('Error');$('#ai').textContent='Error'}async function askAI(text){try{$('#state').textContent='Thinking…';let r=await fetch(backend()+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,image:stream?snap():null,memory:''})});let raw=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+': '+raw);let j=JSON.parse(raw);lastReply=j.text||'No reply';$('#reply').textContent=lastReply;$('#speak').disabled=false;say(lastReply);$('#state').textContent='Ready';$('#ai').textContent='AI ready';badge('Live')}catch(e){fail(e)}}function toggleTalk(){if(recording){recording=false;$('#talk').textContent='Tap to Talk';$('#state').textContent='Processing…';rec.stop();return}chunks=[];rec=new MediaRecorder(new MediaStream(stream.getAudioTracks()));rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=async()=>{try{let blob=new Blob(chunks,{type:rec.mimeType||'audio/mp4'}),fd=new FormData();fd.append('audio',blob,'speech.webm');let r=await fetch(backend()+'/transcribe',{method:'POST',body:fd});let raw=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+': '+raw);let j=JSON.parse(raw);$('#transcript').textContent='You: '+j.text;await askAI(j.text)}catch(e){fail(e)}};rec.start();recording=true;$('#talk').textContent='Stop & Ask';$('#state').textContent='Listening…';badge('Listening')}function say(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);speechSynthesis.speak(u)}$('#start').onclick=startMedia;$('#talk').onclick=toggleTalk;$('#ask').onclick=()=>{let t=$('#typed').value.trim();if(t)askAI(t)};$('#speak').onclick=()=>say(lastReply);$('#save').onclick=()=>{localStorage.setItem(bk,$('#backend').value.trim().replace(/\/$/,''));alert('Backend saved.')};$('#test').onclick=async()=>{let out=$('#testResult');let b=backend();out.textContent='Testing Worker and Gemini…';try{let health=await fetch(b+'/?test='+Date.now());let hraw=await health.text();if(!health.ok)throw new Error('Worker HTTP '+health.status+': '+hraw);let r=await fetch(b+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:'Reply with exactly: EARA GEMINI OK',image:null,memory:''})});let raw=await r.text();if(!r.ok)throw new Error('Gemini HTTP '+r.status+': '+raw);let j=JSON.parse(raw);out.textContent='SUCCESS — Worker reached Gemini. Reply: '+(j.text||raw);badge('Connected')}catch(e){out.textContent='FAIL — '+(e.message||e);badge('Error')}};if(!localStorage.getItem(bk))localStorage.setItem(bk,DEFAULT_BACKEND);$('#backend').value=localStorage.getItem(bk)||DEFAULT_BACKEND;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['live','memory','tasks','settings'].forEach(id=>$('#'+id).classList.toggle('hidden',id!==b.dataset.tab))});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
